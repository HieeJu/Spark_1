server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/airflow
    username: airflow
    password: airflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs